<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>放射状カメラ万華鏡</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;
  touch-action: manipulation;
}
canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}
video {
  display: none;
}
#ui {
  position: fixed;
  left: max(8px, env(safe-area-inset-left));
  right: max(8px, env(safe-area-inset-right));
  bottom: max(8px, env(safe-area-inset-bottom));
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px;
  border-radius: 999px;
  background: rgba(5, 5, 12, 0.32);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 26px rgba(0,0,0,0.32);
  transition: opacity .25s ease, transform .25s ease;
}
body.playing #ui {
  opacity: .14;
  transform: translateY(4px);
}
body.playing #ui:hover,
body.playing #ui:focus-within {
  opacity: 1;
  transform: translateY(0);
}
body.uiHidden #ui {
  opacity: 0;
  pointer-events: none;
}
button {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 9px 13px;
  color: #111;
  background: linear-gradient(135deg, #fff, #d7f4ff 48%, #ffd9f5);
  font-weight: 750;
  font-size: 13px;
  white-space: nowrap;
}
button:disabled {
  opacity: .55;
}
.control {
  min-width: 116px;
  flex: 1;
}
label {
  display: block;
  font-size: 10px;
  line-height: 1.05;
  opacity: .92;
}
input[type="range"] {
  width: 100%;
  accent-color: #dff5ff;
}
#hideBtn, #showBtn {
  width: 34px;
  height: 34px;
  padding: 0;
}
#showBtn {
  position: fixed;
  right: max(10px, env(safe-area-inset-right));
  bottom: max(10px, env(safe-area-inset-bottom));
  z-index: 21;
  opacity: 0;
  pointer-events: none;
  background: rgba(255,255,255,.43);
  backdrop-filter: blur(10px);
}
body.uiHidden #showBtn {
  opacity: .30;
  pointer-events: auto;
}
body.uiHidden #showBtn:hover {
  opacity: 1;
}
#status {
  position: fixed;
  left: 50%;
  bottom: 62px;
  transform: translateX(-50%);
  z-index: 15;
  max-width: calc(100vw - 28px);
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(0,0,0,.34);
  backdrop-filter: blur(8px);
  font-size: 12px;
  text-align: center;
  pointer-events: none;
  transition: opacity .4s ease;
}
body.playing #status {
  opacity: 0;
}
@media (min-width: 760px) {
  #ui {
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: min(520px, calc(100vw - 22px));
  }
  body.playing #ui {
    transform: translateX(-50%) translateY(4px);
  }
  body.playing #ui:hover,
  body.playing #ui:focus-within {
    transform: translateX(-50%);
  }
  .control {
    min-width: 210px;
  }
  button {
    font-size: 14px;
  }
}
@media (max-width: 420px) {
  #ui {
    gap: 5px;
    padding: 6px;
  }
  button {
    padding: 8px 10px;
    font-size: 12px;
  }
  .control {
    min-width: 84px;
  }
}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="status">開始後、バーは薄くなります。画面タップで表示・非表示できます。</div>

<div id="ui">
  <button id="startBtn">開始</button>
  <button id="saveBtn" style="display:none;">保存</button>

  <div class="control">
    <label>回転 <span id="rotValue">0.18</span></label>
    <input id="rotationSpeed" type="range" min="-1.2" max="1.2" step="0.01" value="0.18">
  </div>

  <button id="hideBtn" title="操作バーを隠す">×</button>
</div>

<button id="showBtn" title="操作バーを表示">☰</button>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });

const startBtn = document.getElementById("startBtn");
const saveBtn = document.getElementById("saveBtn");
const hideBtn = document.getElementById("hideBtn");
const showBtn = document.getElementById("showBtn");
const statusText = document.getElementById("status");
const rotationSpeedInput = document.getElementById("rotationSpeed");
const rotValue = document.getElementById("rotValue");

let running = false;
let startTime = performance.now();
let saveLock = false;

const SEGMENTS = 16;
const ZOOM = 1.42;
const SATURATION = 1.72;
const CONTRAST = 1.20;
const BRIGHTNESS = 1.08;
const GLOW = 0.16;

const quality = {
  isTablet: false,
  dprCap: 1.5
};

rotationSpeedInput.addEventListener("input", () => {
  rotValue.textContent = rotationSpeedInput.value;
});
rotValue.textContent = rotationSpeedInput.value;

function updateDeviceProfile() {
  const minSide = Math.min(window.innerWidth, window.innerHeight);
  const maxSide = Math.max(window.innerWidth, window.innerHeight);
  quality.isTablet = minSide >= 700 || maxSide >= 1000;
  quality.dprCap = quality.isTablet ? 1.65 : 1.45;
}

function resize() {
  updateDeviceProfile();
  const dpr = Math.min(window.devicePixelRatio || 1, quality.dprCap);
  canvas.width = Math.max(2, Math.floor(window.innerWidth * dpr));
  canvas.height = Math.max(2, Math.floor(window.innerHeight * dpr));
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 180));
resize();

hideBtn.addEventListener("click", () => document.body.classList.add("uiHidden"));
showBtn.addEventListener("click", () => document.body.classList.remove("uiHidden"));

canvas.addEventListener("click", () => {
  if (running) document.body.classList.toggle("uiHidden");
});

startBtn.addEventListener("click", async () => {
  try {
    const constraints = quality.isTablet
      ? { width: { ideal: 1600 }, height: { ideal: 1200 }, facingMode: { ideal: "environment" } }
      : { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: { ideal: "environment" } };

    const stream = await navigator.mediaDevices.getUserMedia({ video: constraints, audio: false });
    video.srcObject = stream;
    await video.play();

    running = true;
    startTime = performance.now();
    startBtn.style.display = "none";
    saveBtn.style.display = "inline-block";
    document.body.classList.add("playing");
    requestAnimationFrame(draw);
  } catch (e) {
    statusText.textContent = "カメラを開始できませんでした。HTTPSまたはローカル環境で開き、権限を確認してください。";
  }
});

saveBtn.addEventListener("click", async () => {
  if (saveLock) return;

  saveLock = true;
  saveBtn.disabled = true;
  const oldText = saveBtn.textContent;
  saveBtn.textContent = "保存中";

  try {
    await new Promise(resolve => requestAnimationFrame(resolve));
    const blob = await canvasToBlob(canvas, "image/png", 1);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    a.href = url;
    a.download = `radial-kaleidoscope-${stamp}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    try {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "radial-kaleidoscope.png";
      a.click();
    } catch (err) {
      alert("保存に失敗しました。ブラウザを変えるか、画面スクリーンショットをご利用ください。");
    }
  } finally {
    saveBtn.textContent = oldText;
    saveBtn.disabled = false;
    saveLock = false;
  }
});

function canvasToBlob(c, type, quality) {
  return new Promise((resolve, reject) => {
    if (!c.toBlob) {
      try {
        const dataUrl = c.toDataURL(type, quality);
        const bin = atob(dataUrl.split(",")[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type }));
      } catch (e) {
        reject(e);
      }
      return;
    }
    c.toBlob(blob => blob ? resolve(blob) : reject(new Error("toBlob failed")), type, quality);
  });
}

function drawWedgeImage(w, h, t, rotation) {
  const cx = w / 2;
  const cy = h / 2;
  const angle = Math.PI * 2 / SEGMENTS;
  const radius = Math.sqrt(w * w + h * h) * 0.72;

  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  const scale = Math.max(w / vw, h / vh) * ZOOM;
  const dw = vw * scale;
  const dh = vh * scale;

  const driftX = Math.sin(t * 0.31) * dw * 0.035 + Math.sin(t * 0.11) * dw * 0.015;
  const driftY = Math.cos(t * 0.27) * dh * 0.035 + Math.cos(t * 0.13) * dh * 0.015;
  const innerRotation = Math.sin(t * 0.18) * 0.035;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.filter = `saturate(${SATURATION}) contrast(${CONTRAST}) brightness(${BRIGHTNESS})`;

  for (let i = 0; i < SEGMENTS; i++) {
    ctx.save();
    ctx.rotate(i * angle);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, -angle / 2 - 0.003, angle / 2 + 0.003);
    ctx.closePath();
    ctx.clip();

    if (i % 2 === 1) {
      ctx.scale(1, -1);
    }

    ctx.rotate(innerRotation + Math.sin(t * 0.12 + i * 0.21) * 0.010);

    ctx.drawImage(
      video,
      -dw / 2 + driftX,
      -dh / 2 + driftY,
      dw,
      dh
    );

    ctx.restore();
  }

  ctx.restore();
  ctx.filter = "none";
}

function drawSoftGlow(w, h) {
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = GLOW;
  ctx.filter = `blur(${Math.max(4, Math.min(w, h) * 0.010)}px) saturate(1.18)`;
  ctx.drawImage(canvas, 0, 0);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.filter = "none";
}

function drawMirrorGuides(w, h, rotation) {
  const cx = w / 2;
  const cy = h / 2;
  const radius = Math.sqrt(w * w + h * h) * 0.72;
  const angle = Math.PI * 2 / SEGMENTS;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.globalCompositeOperation = "screen";
  ctx.lineWidth = Math.max(0.7, Math.min(w, h) * 0.0008);
  ctx.strokeStyle = "rgba(255,255,255,0.055)";

  for (let i = 0; i < SEGMENTS; i++) {
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(radius, 0);
    ctx.stroke();
  }

  ctx.strokeStyle = "rgba(210,235,255,0.035)";
  for (let r = radius * 0.18; r < radius * 0.96; r += radius * 0.18) {
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

function drawLensFinish(w, h) {
  const cx = w / 2;
  const cy = h / 2;
  const minR = Math.min(w, h);
  const maxR = Math.sqrt(w * w + h * h) * 0.64;

  ctx.save();

  const vignette = ctx.createRadialGradient(cx, cy, minR * 0.18, cx, cy, maxR);
  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(0.72, "rgba(0,0,0,0.03)");
  vignette.addColorStop(0.90, "rgba(0,0,0,0.24)");
  vignette.addColorStop(1, "rgba(0,0,0,0.72)");
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, w, h);

  ctx.globalCompositeOperation = "screen";
  const shine = ctx.createRadialGradient(cx - minR * 0.22, cy - minR * 0.24, 0, cx, cy, minR * 0.62);
  shine.addColorStop(0, "rgba(255,255,255,0.09)");
  shine.addColorStop(0.22, "rgba(180,230,255,0.035)");
  shine.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = shine;
  ctx.fillRect(0, 0, w, h);

  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

function draw() {
  if (!running) return;

  const w = canvas.width;
  const h = canvas.height;
  const t = (performance.now() - startTime) / 1000;
  const rotationSpeed = Number(rotationSpeedInput.value);
  const rotation = t * rotationSpeed * 0.27;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);

  drawWedgeImage(w, h, t, rotation);
  drawSoftGlow(w, h);
  drawMirrorGuides(w, h, rotation);
  drawLensFinish(w, h);

  requestAnimationFrame(draw);
}
</script>
</body>
</html>
