<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カレイドスケープ</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;
  touch-action: manipulation;
}
canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}
video {
  display: none;
}
#preview {
  position: fixed;
  right: max(10px, env(safe-area-inset-right));
  bottom: max(8px, env(safe-area-inset-bottom));
  z-index: 18;
  width: min(26vw, 180px);
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.22);
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
  opacity: .82;
  display: none;
}
body.playing #preview {
  display: block;
}
#preview video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}
@media (min-width: 760px) {
  #preview {
    width: 170px;
    bottom: max(8px, env(safe-area-inset-bottom));
  }
}
@media (max-width: 420px) {
  #preview {
    width: 34vw;
    bottom: max(8px, env(safe-area-inset-bottom));
  }
}
#ui {
  position: fixed;
  left: max(8px, env(safe-area-inset-left));
  right: max(8px, env(safe-area-inset-right));
  bottom: max(8px, env(safe-area-inset-bottom));
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px;
  border-radius: 999px;
  background: rgba(5, 5, 12, 0.30);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 26px rgba(0,0,0,0.32);
  transition: opacity .25s ease, transform .25s ease;
}
body.playing #ui {
  opacity: .16;
  transform: translateY(4px);
}
body.playing #ui:hover,
body.playing #ui:focus-within {
  opacity: 1;
  transform: translateY(0);
}
button {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 9px 13px;
  color: #111;
  background: linear-gradient(135deg, #fff, #d7f4ff 48%, #ffd9f5);
  font-weight: 750;
  font-size: 13px;
  white-space: nowrap;
}
button:disabled {
  opacity: .55;
}
.control {
  min-width: 116px;
  flex: 1;
}
label {
  display: block;
  font-size: 10px;
  line-height: 1.05;
  opacity: .92;
}
input[type="range"] {
  width: 100%;
  accent-color: #dff5ff;
}
#status {
  position: fixed;
  left: 50%;
  bottom: 62px;
  transform: translateX(-50%);
  z-index: 15;
  max-width: calc(100vw - 28px);
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(0,0,0,.34);
  backdrop-filter: blur(8px);
  font-size: 12px;
  text-align: center;
  pointer-events: none;
  transition: opacity .4s ease;
}
#appName {
  position: fixed;
  left: max(12px, env(safe-area-inset-left));
  top: max(10px, env(safe-area-inset-top));
  z-index: 12;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(0,0,0,.22);
  backdrop-filter: blur(8px);
  font-size: 13px;
  letter-spacing: .08em;
  pointer-events: none;
  opacity: .82;
  transition: opacity .4s ease;
}
body.playing #status {
  opacity: 0;
}
body.playing #appName {
  opacity: .18;
}
@media (min-width: 760px) {
  #ui {
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: min(500px, calc(100vw - 22px));
  }
  body.playing #ui {
    transform: translateX(-50%) translateY(4px);
  }
  body.playing #ui:hover,
  body.playing #ui:focus-within {
    transform: translateX(-50%);
  }
  .control {
    min-width: 210px;
  }
  button {
    font-size: 14px;
  }
}
@media (max-width: 420px) {
  #ui {
    gap: 5px;
    padding: 6px;
  }
  button {
    padding: 8px 10px;
    font-size: 12px;
  }
  .control {
    min-width: 84px;
  }
}
@media (max-width: 620px) {
  #ui {
    left: max(8px, env(safe-area-inset-left));
    right: auto;
    width: min(58vw, 270px);
    gap: 5px;
    padding: 6px;
  }
  button {
    padding: 8px 10px;
    font-size: 12px;
  }
  .control {
    min-width: 0;
  }
  #preview {
    width: min(36vw, 150px);
    right: max(8px, env(safe-area-inset-right));
    bottom: max(8px, env(safe-area-inset-bottom));
  }
}

@media (max-width: 380px) {
  #ui {
    width: min(54vw, 220px);
  }
  button {
    padding: 7px 8px;
    font-size: 11px;
  }
  label {
    font-size: 9px;
  }
  #preview {
    width: 34vw;
  }
}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="preview">
  <video id="previewVideo" autoplay playsinline muted></video>
</div>

<div id="appName">カレイドスケープ</div>
<div id="status">開始後、操作バーは自動で薄くなります。</div>

<div id="ui">
  <button id="startBtn">開始</button>
  <button id="saveBtn" style="display:none;">保存</button>

  <div class="control">
    <label>回転 <span id="rotValue">0.18</span></label>
    <input id="rotationSpeed" type="range" min="-1.2" max="1.2" step="0.01" value="0.18">
  </div>
</div>

<script>
const video = document.getElementById("video");
const previewVideo = document.getElementById("previewVideo");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });

const startBtn = document.getElementById("startBtn");
const saveBtn = document.getElementById("saveBtn");
const statusText = document.getElementById("status");
const rotationSpeedInput = document.getElementById("rotationSpeed");
const rotValue = document.getElementById("rotValue");

let running = false;
let startTime = performance.now();
let saveLock = false;

const SEGMENTS = 16;
const ZOOM = 1.45;

const LOOK = {
  saturation: 1.82,
  contrast: 1.24,
  brightness: 1.10,
  glow: 0.20,
  prism: 0.12,
  highlight: 0.16
};

const quality = {
  isTablet: false,
  dprCap: 1.5
};

rotationSpeedInput.addEventListener("input", () => {
  rotValue.textContent = rotationSpeedInput.value;
});
rotValue.textContent = rotationSpeedInput.value;

function updateDeviceProfile() {
  const minSide = Math.min(window.innerWidth, window.innerHeight);
  const maxSide = Math.max(window.innerWidth, window.innerHeight);
  quality.isTablet = minSide >= 700 || maxSide >= 1000;
  quality.dprCap = quality.isTablet ? 1.65 : 1.45;
}

function resize() {
  updateDeviceProfile();
  const dpr = Math.min(window.devicePixelRatio || 1, quality.dprCap);
  canvas.width = Math.max(2, Math.floor(window.innerWidth * dpr));
  canvas.height = Math.max(2, Math.floor(window.innerHeight * dpr));
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 180));
resize();

startBtn.addEventListener("click", async () => {
  try {
    const constraints = quality.isTablet
      ? { width: { ideal: 1600 }, height: { ideal: 1200 }, facingMode: { ideal: "environment" } }
      : { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: { ideal: "environment" } };

    const stream = await navigator.mediaDevices.getUserMedia({ video: constraints, audio: false });
    video.srcObject = stream;
    previewVideo.srcObject = stream;
    await video.play();
    await previewVideo.play();

    running = true;
    startTime = performance.now();
    startBtn.style.display = "none";
    saveBtn.style.display = "inline-block";
    document.body.classList.add("playing");
    requestAnimationFrame(draw);
  } catch (e) {
    statusText.textContent = "カメラを開始できませんでした。HTTPSまたはローカル環境で開き、権限を確認してください。";
  }
});

saveBtn.addEventListener("click", async () => {
  if (saveLock) return;

  saveLock = true;
  saveBtn.disabled = true;
  const oldText = saveBtn.textContent;
  saveBtn.textContent = "保存中";

  try {
    await new Promise(resolve => requestAnimationFrame(resolve));
    const captureCanvas = makeCaptureCanvasWithPreview();
    const blob = await canvasToBlob(captureCanvas, "image/png", 1);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    a.href = url;
    a.download = `kaleidoscape-${stamp}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    try {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "kaleidoscape.png";
      a.click();
    } catch (err) {
      alert("保存に失敗しました。ブラウザを変えるか、画面スクリーンショットをご利用ください。");
    }
  } finally {
    saveBtn.textContent = oldText;
    saveBtn.disabled = false;
    saveLock = false;
  }
});

function makeCaptureCanvasWithPreview() {
  const out = document.createElement("canvas");
  out.width = canvas.width;
  out.height = canvas.height;
  const octx = out.getContext("2d", { alpha: false });

  octx.drawImage(canvas, 0, 0);

  const preview = document.getElementById("preview");
  if (preview && video.videoWidth && video.videoHeight) {
    const rect = preview.getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / canvasRect.width;
    const scaleY = canvas.height / canvasRect.height;

    const x = (rect.left - canvasRect.left) * scaleX;
    const y = (rect.top - canvasRect.top) * scaleY;
    const w = rect.width * scaleX;
    const h = rect.height * scaleY;
    const r = Math.max(8, Math.min(w, h) * 0.08);

    octx.save();

    octx.shadowColor = "rgba(0,0,0,0.45)";
    octx.shadowBlur = Math.max(8, w * 0.06);
    octx.shadowOffsetY = Math.max(3, h * 0.025);

    octx.fillStyle = "rgba(0,0,0,0.38)";
    roundedRect(octx, x, y, w, h, r);
    octx.fill();

    octx.shadowColor = "transparent";
    roundedRect(octx, x, y, w, h, r);
    octx.clip();

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const scale = Math.max(w / vw, h / vh);
    const dw = vw * scale;
    const dh = vh * scale;

    octx.translate(x + w, y);
    octx.scale(-1, 1);
    octx.drawImage(video, -(w + (dw - w) / 2), -(dh - h) / 2, dw, dh);

    octx.restore();

    octx.save();
    octx.strokeStyle = "rgba(255,255,255,0.26)";
    octx.lineWidth = Math.max(1, Math.min(w, h) * 0.012);
    roundedRect(octx, x, y, w, h, r);
    octx.stroke();
    octx.restore();
  }

  return out;
}

function roundedRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function canvasToBlob(c, type, quality) {
  return new Promise((resolve, reject) => {
    if (!c.toBlob) {
      try {
        const dataUrl = c.toDataURL(type, quality);
        const bin = atob(dataUrl.split(",")[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type }));
      } catch (e) {
        reject(e);
      }
      return;
    }
    c.toBlob(blob => blob ? resolve(blob) : reject(new Error("toBlob failed")), type, quality);
  });
}

function drawWedgeImage(w, h, t, rotation, prismOffset = 0, alpha = 1) {
  const cx = w / 2;
  const cy = h / 2;
  const angle = Math.PI * 2 / SEGMENTS;
  const radius = Math.sqrt(w * w + h * h) * 0.74;

  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  const scale = Math.max(w / vw, h / vh) * ZOOM;
  const dw = vw * scale;
  const dh = vh * scale;

  const driftX = Math.sin(t * 0.31) * dw * 0.035 + Math.sin(t * 0.11) * dw * 0.015;
  const driftY = Math.cos(t * 0.27) * dh * 0.035 + Math.cos(t * 0.13) * dh * 0.015;
  const innerRotation = Math.sin(t * 0.18) * 0.035;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation + prismOffset);
  ctx.globalAlpha = alpha;
  ctx.filter = `saturate(${LOOK.saturation}) contrast(${LOOK.contrast}) brightness(${LOOK.brightness})`;

  for (let i = 0; i < SEGMENTS; i++) {
    ctx.save();
    ctx.rotate(i * angle);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, -angle / 2 - 0.004, angle / 2 + 0.004);
    ctx.closePath();
    ctx.clip();

    if (i % 2 === 1) {
      ctx.scale(1, -1);
    }

    ctx.rotate(innerRotation + Math.sin(t * 0.12 + i * 0.21) * 0.010);

    ctx.drawImage(
      video,
      -dw / 2 + driftX,
      -dh / 2 + driftY,
      dw,
      dh
    );

    ctx.restore();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.filter = "none";
}

function drawPrism(w, h, t, rotation) {
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  drawWedgeImage(w, h, t, rotation + 0.006, 0.002, LOOK.prism);
  drawWedgeImage(w, h, t, rotation - 0.006, -0.002, LOOK.prism * 0.75);
  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

function drawSoftGlow(w, h) {
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = LOOK.glow;
  ctx.filter = `blur(${Math.max(4, Math.min(w, h) * 0.010)}px) saturate(1.20) brightness(1.08)`;
  ctx.drawImage(canvas, 0, 0);

  ctx.globalAlpha = LOOK.highlight;
  ctx.filter = `blur(${Math.max(8, Math.min(w, h) * 0.020)}px) contrast(1.35) brightness(1.18)`;
  ctx.drawImage(canvas, 0, 0);

  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.filter = "none";
}

function drawMirrorGuides(w, h, rotation) {
  const cx = w / 2;
  const cy = h / 2;
  const radius = Math.sqrt(w * w + h * h) * 0.74;
  const angle = Math.PI * 2 / SEGMENTS;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.globalCompositeOperation = "screen";
  ctx.lineWidth = Math.max(0.65, Math.min(w, h) * 0.0007);
  ctx.strokeStyle = "rgba(255,255,255,0.045)";

  for (let i = 0; i < SEGMENTS; i++) {
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(radius, 0);
    ctx.stroke();
  }

  ctx.strokeStyle = "rgba(210,235,255,0.028)";
  for (let r = radius * 0.22; r < radius * 0.96; r += radius * 0.20) {
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

function drawBeautyFinish(w, h, t) {
  const cx = w / 2;
  const cy = h / 2;
  const minR = Math.min(w, h);
  const maxR = Math.sqrt(w * w + h * h) * 0.65;

  ctx.save();

  ctx.globalCompositeOperation = "screen";
  const centerLight = ctx.createRadialGradient(cx, cy, 0, cx, cy, minR * 0.45);
  centerLight.addColorStop(0, "rgba(255,255,255,0.08)");
  centerLight.addColorStop(0.28, "rgba(170,225,255,0.035)");
  centerLight.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = centerLight;
  ctx.fillRect(0, 0, w, h);

  const sweep = ctx.createLinearGradient(
    cx + Math.cos(t * 0.18) * minR * 0.5,
    cy + Math.sin(t * 0.18) * minR * 0.5,
    cx - Math.cos(t * 0.18) * minR * 0.5,
    cy - Math.sin(t * 0.18) * minR * 0.5
  );
  sweep.addColorStop(0, "rgba(255,255,255,0)");
  sweep.addColorStop(0.5, "rgba(255,255,255,0.045)");
  sweep.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = sweep;
  ctx.fillRect(0, 0, w, h);

  ctx.globalCompositeOperation = "source-over";
  const vignette = ctx.createRadialGradient(cx, cy, minR * 0.18, cx, cy, maxR);
  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(0.72, "rgba(0,0,0,0.02)");
  vignette.addColorStop(0.90, "rgba(0,0,0,0.20)");
  vignette.addColorStop(1, "rgba(0,0,0,0.66)");
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, w, h);

  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

function draw() {
  if (!running) return;

  const w = canvas.width;
  const h = canvas.height;
  const t = (performance.now() - startTime) / 1000;
  const rotationSpeed = Number(rotationSpeedInput.value);
  const rotation = t * rotationSpeed * 0.27;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);

  drawWedgeImage(w, h, t, rotation);
  drawPrism(w, h, t, rotation);
  drawSoftGlow(w, h);
  drawMirrorGuides(w, h, rotation);
  drawBeautyFinish(w, h, t);

  requestAnimationFrame(draw);
}
</script>
</body>
</html>
