<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全面カメラ万華鏡</title>
<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020207;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;
}
canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}
video {
  display: none;
}
#ui {
  position: fixed;
  left: max(10px, env(safe-area-inset-left));
  right: max(10px, env(safe-area-inset-right));
  bottom: max(10px, env(safe-area-inset-bottom));
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 999px;
  background: rgba(4, 4, 10, 0.38);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 28px rgba(0,0,0,0.3);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
body.playing #ui {
  opacity: 0.18;
  transform: translateY(4px);
}
body.playing #ui:hover,
body.playing #ui:focus-within {
  opacity: 1;
  transform: translateY(0);
}
button {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 9px 13px;
  color: #111;
  background: linear-gradient(135deg, #fff, #ccefff 45%, #ffd8f4);
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
}
.control {
  min-width: 92px;
  flex: 1;
}
label {
  display: block;
  font-size: 10px;
  line-height: 1.1;
  opacity: 0.92;
}
input[type="range"] {
  width: 100%;
  accent-color: #d8f2ff;
}
select {
  width: 108px;
  border-radius: 999px;
  padding: 8px 9px;
  color: white;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.16);
  font-size: 12px;
}
#status {
  position: fixed;
  left: 50%;
  bottom: 72px;
  transform: translateX(-50%);
  z-index: 9;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(0,0,0,0.34);
  backdrop-filter: blur(8px);
  font-size: 12px;
  opacity: 0.9;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
body.playing #status {
  opacity: 0;
}
#hideBtn {
  width: 34px;
  height: 34px;
  padding: 0;
}
body.uiHidden #ui {
  opacity: 0;
  pointer-events: none;
}
#showBtn {
  position: fixed;
  right: max(10px, env(safe-area-inset-right));
  bottom: max(10px, env(safe-area-inset-bottom));
  z-index: 11;
  width: 42px;
  height: 42px;
  padding: 0;
  opacity: 0;
  pointer-events: none;
  background: rgba(255,255,255,0.42);
  backdrop-filter: blur(10px);
}
body.uiHidden #showBtn {
  opacity: 0.35;
  pointer-events: auto;
}
body.uiHidden #showBtn:hover {
  opacity: 1;
}
@media (max-width: 620px) {
  #ui {
    gap: 6px;
  }
  .control {
    min-width: 68px;
  }
  select {
    width: 86px;
  }
  button {
    padding: 8px 10px;
    font-size: 13px;
  }
}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="status">カメラ開始後、下のバーは自動で薄くなります。×で完全に隠せます。</div>

<div id="ui">
  <button id="startBtn">開始</button>
  <button id="snapBtn" style="display:none;">保存</button>

  <div class="control">
    <label>鏡 <span id="segValue">16</span></label>
    <input id="segments" type="range" min="6" max="36" value="16">
  </div>

  <div class="control">
    <label>回転 <span id="rotValue">0.20</span></label>
    <input id="rotationSpeed" type="range" min="-1.5" max="1.5" step="0.01" value="0.20">
  </div>

  <select id="mode">
    <option value="crystal">結晶</option>
    <option value="glass">硝子</option>
    <option value="dream">夢色</option>
    <option value="classic">淡色</option>
  </select>

  <button id="hideBtn" title="操作バーを隠す">×</button>
</div>

<button id="showBtn" title="操作バーを表示">☰</button>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startBtn = document.getElementById("startBtn");
const snapBtn = document.getElementById("snapBtn");
const hideBtn = document.getElementById("hideBtn");
const showBtn = document.getElementById("showBtn");
const statusText = document.getElementById("status");

const segmentsInput = document.getElementById("segments");
const rotationSpeedInput = document.getElementById("rotationSpeed");
const modeInput = document.getElementById("mode");

const segValue = document.getElementById("segValue");
const rotValue = document.getElementById("rotValue");

let running = false;
let startTime = performance.now();

const BEAUTY_ZOOM = 1.42;
const BEAUTY_SATURATION = 1.72;
const BEAUTY_GLOW = 0.34;

function bindValue(input, output) {
  const update = () => output.textContent = input.value;
  input.addEventListener("input", update);
  update();
}
bindValue(segmentsInput, segValue);
bindValue(rotationSpeedInput, rotValue);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
}
window.addEventListener("resize", resize);
resize();

hideBtn.addEventListener("click", () => {
  document.body.classList.add("uiHidden");
});
showBtn.addEventListener("click", () => {
  document.body.classList.remove("uiHidden");
});

canvas.addEventListener("click", () => {
  if (running) document.body.classList.toggle("uiHidden");
});

startBtn.addEventListener("click", async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    running = true;
    startTime = performance.now();
    startBtn.style.display = "none";
    snapBtn.style.display = "inline-block";
    document.body.classList.add("playing");
    statusText.textContent = "";
    requestAnimationFrame(draw);
  } catch (e) {
    statusText.textContent = "カメラを開始できませんでした。HTTPSまたはローカル環境で開き、権限を確認してください。";
  }
});

snapBtn.addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "kaleidoscope.png";
  a.click();
});

function currentFilters(mode) {
  const s = BEAUTY_SATURATION;
  if (mode === "dream") {
    return `saturate(${s * 1.22}) contrast(1.18) brightness(1.12) hue-rotate(18deg)`;
  }
  if (mode === "glass") {
    return `saturate(${s * 0.98}) contrast(1.34) brightness(1.06)`;
  }
  if (mode === "classic") {
    return `saturate(${s * 0.78}) contrast(1.08) brightness(1.03)`;
  }
  return `saturate(${s}) contrast(1.24) brightness(1.08)`;
}

function drawVignette(w, h) {
  const cx = w / 2;
  const cy = h / 2;
  const r = Math.max(w, h) * 0.72;
  const g = ctx.createRadialGradient(cx, cy, r * 0.12, cx, cy, r);
  g.addColorStop(0, "rgba(255,255,255,0)");
  g.addColorStop(0.72, "rgba(0,0,0,0.06)");
  g.addColorStop(1, "rgba(0,0,0,0.70)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

function drawCrystalLines(w, h, segments, baseRotation) {
  const cx = w / 2;
  const cy = h / 2;
  const radius = Math.sqrt(w * w + h * h);
  const angle = Math.PI * 2 / segments;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(baseRotation);
  ctx.globalCompositeOperation = "screen";
  ctx.strokeStyle = "rgba(255,255,255,0.115)";
  ctx.lineWidth = Math.max(1, Math.min(w, h) * 0.00135);

  for (let i = 0; i < segments; i++) {
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(radius, 0);
    ctx.stroke();
  }

  ctx.strokeStyle = "rgba(205,235,255,0.065)";
  for (let ring = 0.22; ring <= 0.95; ring += 0.18) {
    ctx.beginPath();
    ctx.arc(0, 0, radius * ring, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

function draw() {
  if (!running) return;

  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;

  const segments = Number(segmentsInput.value);
  const rotationSpeed = Number(rotationSpeedInput.value);
  const mode = modeInput.value;

  const t = (performance.now() - startTime) / 1000;
  const baseRotation = t * rotationSpeed * 0.28;
  const drift = Math.sin(t * 0.45) * 34 + Math.cos(t * 0.27) * 22;

  const angle = Math.PI * 2 / segments;
  const radius = Math.sqrt(w * w + h * h);

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#020207";
  ctx.fillRect(0, 0, w, h);

  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  const scale = Math.max(w / vw, h / vh) * BEAUTY_ZOOM;
  const dw = vw * scale;
  const dh = vh * scale;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(baseRotation);

  ctx.filter = currentFilters(mode);

  for (let i = 0; i < segments; i++) {
    ctx.save();
    ctx.rotate(i * angle);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, -angle / 2, angle / 2);
    ctx.closePath();
    ctx.clip();

    if (i % 2 === 1) {
      ctx.scale(1, -1);
    }

    const innerRot = Math.sin(t * 0.2 + i * 0.1) * 0.035;
    ctx.rotate(innerRot);

    const sx = -dw / 2 + Math.sin(t * 0.31 + i) * drift;
    const sy = -dh / 2 + Math.cos(t * 0.29 + i * 0.7) * drift;

    ctx.drawImage(video, sx, sy, dw, dh);

    if (mode !== "classic") {
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = BEAUTY_GLOW * 0.22;
      ctx.filter = `blur(${Math.max(4, Math.min(w,h) * 0.012)}px) ${currentFilters(mode)}`;
      ctx.drawImage(video, sx, sy, dw, dh);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      ctx.filter = currentFilters(mode);
    }

    ctx.restore();
  }

  ctx.restore();
  ctx.filter = "none";

  if (mode === "dream") {
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
    g.addColorStop(0, "rgba(255, 210, 245, 0.17)");
    g.addColorStop(0.45, "rgba(150, 230, 255, 0.10)");
    g.addColorStop(1, "rgba(255, 230, 130, 0.045)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  drawCrystalLines(w, h, segments, baseRotation);
  drawVignette(w, h);

  requestAnimationFrame(draw);
}
</script>
</body>
</html>
