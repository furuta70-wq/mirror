<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>放射三角形カメラ万華鏡</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020207;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;
  touch-action: manipulation;
}
canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}
video { display: none; }
#ui {
  position: fixed;
  left: max(8px, env(safe-area-inset-left));
  right: max(8px, env(safe-area-inset-right));
  bottom: max(8px, env(safe-area-inset-bottom));
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px;
  border-radius: 999px;
  background: rgba(4, 4, 10, 0.33);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 26px rgba(0,0,0,0.32);
  transition: opacity .25s ease, transform .25s ease;
}
body.playing #ui {
  opacity: .16;
  transform: translateY(4px);
}
body.playing #ui:hover,
body.playing #ui:focus-within {
  opacity: 1;
  transform: translateY(0);
}
body.uiHidden #ui {
  opacity: 0;
  pointer-events: none;
}
button {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 9px 13px;
  color: #111;
  background: linear-gradient(135deg, #fff, #d9f4ff 48%, #ffd9f5);
  font-weight: 750;
  font-size: 13px;
  white-space: nowrap;
}
button:disabled { opacity: .55; }
.control {
  min-width: 120px;
  flex: 1;
}
label {
  display: block;
  font-size: 10px;
  line-height: 1.05;
  opacity: .92;
}
input[type="range"] {
  width: 100%;
  accent-color: #dff5ff;
}
#hideBtn, #showBtn {
  width: 34px;
  height: 34px;
  padding: 0;
}
#showBtn {
  position: fixed;
  right: max(10px, env(safe-area-inset-right));
  bottom: max(10px, env(safe-area-inset-bottom));
  z-index: 21;
  opacity: 0;
  pointer-events: none;
  background: rgba(255,255,255,.43);
  backdrop-filter: blur(10px);
}
body.uiHidden #showBtn {
  opacity: .32;
  pointer-events: auto;
}
body.uiHidden #showBtn:hover { opacity: 1; }
#status {
  position: fixed;
  left: 50%;
  bottom: 62px;
  transform: translateX(-50%);
  z-index: 15;
  max-width: calc(100vw - 28px);
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(0,0,0,.34);
  backdrop-filter: blur(8px);
  font-size: 12px;
  text-align: center;
  pointer-events: none;
  transition: opacity .4s ease;
}
body.playing #status { opacity: 0; }
@media (min-width: 760px) {
  #ui {
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: min(520px, calc(100vw - 22px));
  }
  body.playing #ui {
    transform: translateX(-50%) translateY(4px);
  }
  body.playing #ui:hover,
  body.playing #ui:focus-within {
    transform: translateX(-50%);
  }
  .control { min-width: 210px; }
  button { font-size: 14px; }
}
@media (max-width: 420px) {
  #ui { gap: 5px; padding: 6px; }
  button { padding: 8px 10px; font-size: 12px; }
  .control { min-width: 84px; }
}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="status">開始後、バーは薄くなります。画面タップで表示・非表示できます。</div>

<div id="ui">
  <button id="startBtn">開始</button>
  <button id="saveBtn" style="display:none;">保存</button>

  <div class="control">
    <label>回転 <span id="rotValue">0.20</span></label>
    <input id="rotationSpeed" type="range" min="-1.2" max="1.2" step="0.01" value="0.20">
  </div>

  <button id="hideBtn" title="操作バーを隠す">×</button>
</div>

<button id="showBtn" title="操作バーを表示">☰</button>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });

const startBtn = document.getElementById("startBtn");
const saveBtn = document.getElementById("saveBtn");
const hideBtn = document.getElementById("hideBtn");
const showBtn = document.getElementById("showBtn");
const statusText = document.getElementById("status");
const rotationSpeedInput = document.getElementById("rotationSpeed");
const rotValue = document.getElementById("rotValue");

let running = false;
let startTime = performance.now();
let saveLock = false;

const quality = { dprCap: 1.5, isTablet: false };

const SEGMENTS = 12;
const RINGS = 7;
const BEAUTY_SATURATION = 1.72;
const BEAUTY_GLOW = 0.24;

rotationSpeedInput.addEventListener("input", () => {
  rotValue.textContent = rotationSpeedInput.value;
});
rotValue.textContent = rotationSpeedInput.value;

function updateDeviceProfile() {
  const minSide = Math.min(window.innerWidth, window.innerHeight);
  const maxSide = Math.max(window.innerWidth, window.innerHeight);
  quality.isTablet = minSide >= 700 || maxSide >= 1000;
  quality.dprCap = quality.isTablet ? 1.65 : 1.45;
}

function resize() {
  updateDeviceProfile();
  const dpr = Math.min(window.devicePixelRatio || 1, quality.dprCap);
  canvas.width = Math.max(2, Math.floor(window.innerWidth * dpr));
  canvas.height = Math.max(2, Math.floor(window.innerHeight * dpr));
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 180));
resize();

hideBtn.addEventListener("click", () => document.body.classList.add("uiHidden"));
showBtn.addEventListener("click", () => document.body.classList.remove("uiHidden"));

canvas.addEventListener("click", () => {
  if (running) document.body.classList.toggle("uiHidden");
});

startBtn.addEventListener("click", async () => {
  try {
    const constraints = quality.isTablet
      ? { width: { ideal: 1600 }, height: { ideal: 1200 }, facingMode: { ideal: "environment" } }
      : { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: { ideal: "environment" } };

    const stream = await navigator.mediaDevices.getUserMedia({ video: constraints, audio: false });
    video.srcObject = stream;
    await video.play();

    running = true;
    startTime = performance.now();
    startBtn.style.display = "none";
    saveBtn.style.display = "inline-block";
    document.body.classList.add("playing");
    requestAnimationFrame(draw);
  } catch (e) {
    statusText.textContent = "カメラを開始できませんでした。HTTPSまたはローカル環境で開き、権限を確認してください。";
  }
});

saveBtn.addEventListener("click", async () => {
  if (saveLock) return;
  saveLock = true;
  saveBtn.disabled = true;
  const oldText = saveBtn.textContent;
  saveBtn.textContent = "保存中";

  try {
    await new Promise(resolve => requestAnimationFrame(resolve));
    const blob = await canvasToBlob(canvas, "image/png", 1);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    a.href = url;
    a.download = `kaleidoscope-${stamp}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    try {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "kaleidoscope.png";
      a.click();
    } catch (err) {
      alert("保存に失敗しました。ブラウザを変えるか、画面スクリーンショットをご利用ください。");
    }
  } finally {
    saveBtn.textContent = oldText;
    saveBtn.disabled = false;
    saveLock = false;
  }
});

function canvasToBlob(c, type, quality) {
  return new Promise((resolve, reject) => {
    if (!c.toBlob) {
      try {
        const dataUrl = c.toDataURL(type, quality);
        const bin = atob(dataUrl.split(",")[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type }));
      } catch (e) { reject(e); }
      return;
    }
    c.toBlob(blob => blob ? resolve(blob) : reject(new Error("toBlob failed")), type, quality);
  });
}

function filters() {
  return `saturate(${BEAUTY_SATURATION}) contrast(1.24) brightness(1.08)`;
}

function clipTriangleByPolar(cx, cy, r1, r2, a1, a2) {
  const mid = (a1 + a2) / 2;
  const p1 = { x: cx + Math.cos(a1) * r2, y: cy + Math.sin(a1) * r2 };
  const p2 = { x: cx + Math.cos(a2) * r2, y: cy + Math.sin(a2) * r2 };
  const p3 = { x: cx + Math.cos(mid) * r1, y: cy + Math.sin(mid) * r1 };

  ctx.beginPath();
  ctx.moveTo(p3.x, p3.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.closePath();
  ctx.clip();

  return { p1, p2, p3, mid };
}

function drawCameraPatch(cellCx, cellCy, size, angle, mirrorX, mirrorY, t, seed) {
  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;

  const crop = Math.min(vw, vh) * 0.52;
  const srcCx = vw * 0.5 + Math.sin(t * 0.33 + seed * 0.37) * vw * 0.13;
  const srcCy = vh * 0.5 + Math.cos(t * 0.29 + seed * 0.21) * vh * 0.13;
  const sx = Math.max(0, Math.min(vw - crop, srcCx - crop / 2));
  const sy = Math.max(0, Math.min(vh - crop, srcCy - crop / 2));

  ctx.save();
  ctx.translate(cellCx, cellCy);
  ctx.rotate(angle + Math.sin(t * 0.18 + seed) * 0.035);
  ctx.scale(mirrorX ? -1 : 1, mirrorY ? -1 : 1);

  const drawSize = size * 2.65;
  ctx.drawImage(video, sx, sy, crop, crop, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
  ctx.restore();
}

function drawRadialTriangleCells(w, h, t, rotation) {
  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.sqrt(w*w + h*h) * 0.58;
  const minR = Math.min(w, h) * 0.035;
  const step = (maxR - minR) / RINGS;
  const angleStep = Math.PI * 2 / SEGMENTS;

  ctx.save();
  ctx.filter = filters();

  for (let ring = 0; ring < RINGS; ring++) {
    const r1 = minR + ring * step;
    const r2 = minR + (ring + 1.08) * step;
    const ringShift = (ring % 2) * angleStep / 2;
    const localSpin = rotation * (1 + ring * 0.025);

    for (let i = 0; i < SEGMENTS; i++) {
      const a1 = i * angleStep + ringShift + localSpin - angleStep * 0.51;
      const a2 = i * angleStep + ringShift + localSpin + angleStep * 0.51;
      const mid = (a1 + a2) / 2;
      const cellR = (r1 + r2) / 2;
      const cellCx = cx + Math.cos(mid) * cellR;
      const cellCy = cy + Math.sin(mid) * cellR;
      const size = Math.max(step * 1.25, r2 * angleStep * 1.15);
      const seed = ring * 19 + i;

      ctx.save();
      const tri = clipTriangleByPolar(cx, cy, r1, r2, a1, a2);

      const mirrorX = (i + ring) % 2 === 1;
      const mirrorY = ring % 2 === 1;
      const patchAngle = mid + Math.PI / 2 + ((i % 3) - 1) * Math.PI / 3;

      drawCameraPatch(cellCx, cellCy, size, patchAngle, mirrorX, mirrorY, t, seed);
      ctx.restore();
    }
  }

  ctx.restore();
  ctx.filter = "none";
}

function drawCenterPrism(w, h, t, rotation) {
  const cx = w / 2;
  const cy = h / 2;
  const radius = Math.min(w, h) * 0.16;
  const angleStep = Math.PI * 2 / SEGMENTS;

  ctx.save();
  ctx.filter = filters();

  for (let i = 0; i < SEGMENTS; i++) {
    const a1 = i * angleStep + rotation - angleStep / 2;
    const a2 = i * angleStep + rotation + angleStep / 2;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a1) * radius, cy + Math.sin(a1) * radius);
    ctx.lineTo(cx + Math.cos(a2) * radius, cy + Math.sin(a2) * radius);
    ctx.closePath();
    ctx.clip();

    const mirrorX = i % 2 === 1;
    drawCameraPatch(cx, cy, radius * 1.35, (a1 + a2) / 2, mirrorX, false, t, i + 100);
    ctx.restore();
  }

  ctx.restore();
  ctx.filter = "none";
}

function drawGlowLayer(w, h, alpha) {
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = alpha;
  ctx.filter = `blur(${Math.max(4, Math.min(w, h) * 0.010)}px) saturate(1.16)`;
  ctx.drawImage(canvas, 0, 0);
  ctx.restore();
  ctx.filter = "none";
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

function drawCellLines(w, h, rotation) {
  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.sqrt(w*w + h*h) * 0.58;
  const minR = Math.min(w, h) * 0.035;
  const step = (maxR - minR) / RINGS;
  const angleStep = Math.PI * 2 / SEGMENTS;

  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.lineWidth = Math.max(0.8, Math.min(w, h) * 0.001);
  ctx.strokeStyle = "rgba(255,255,255,0.12)";

  for (let ring = 0; ring < RINGS; ring++) {
    const r1 = minR + ring * step;
    const r2 = minR + (ring + 1.08) * step;
    const ringShift = (ring % 2) * angleStep / 2;
    const localSpin = rotation * (1 + ring * 0.025);

    for (let i = 0; i < SEGMENTS; i++) {
      const a1 = i * angleStep + ringShift + localSpin - angleStep * 0.51;
      const a2 = i * angleStep + ringShift + localSpin + angleStep * 0.51;
      const mid = (a1 + a2) / 2;

      const p1x = cx + Math.cos(a1) * r2;
      const p1y = cy + Math.sin(a1) * r2;
      const p2x = cx + Math.cos(a2) * r2;
      const p2y = cy + Math.sin(a2) * r2;
      const p3x = cx + Math.cos(mid) * r1;
      const p3y = cy + Math.sin(mid) * r1;

      ctx.beginPath();
      ctx.moveTo(p3x, p3y);
      ctx.lineTo(p1x, p1y);
      ctx.lineTo(p2x, p2y);
      ctx.closePath();
      ctx.stroke();
    }
  }

  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

function drawEyepiece(w, h) {
  const cx = w / 2;
  const cy = h / 2;
  const r = Math.min(w, h) * 0.55;
  const maxR = Math.sqrt(w*w + h*h) * 0.64;

  ctx.save();
  const g = ctx.createRadialGradient(cx, cy, r * 0.45, cx, cy, maxR);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(0.66, "rgba(0,0,0,0.035)");
  g.addColorStop(0.84, "rgba(0,0,0,0.32)");
  g.addColorStop(1, "rgba(0,0,0,0.86)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.globalCompositeOperation = "screen";
  const shine = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.38, 0, cx, cy, r);
  shine.addColorStop(0, "rgba(255,255,255,0.12)");
  shine.addColorStop(0.25, "rgba(180,230,255,0.04)");
  shine.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = shine;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

function draw() {
  if (!running) return;

  const w = canvas.width;
  const h = canvas.height;
  const t = (performance.now() - startTime) / 1000;
  const rotationSpeed = Number(rotationSpeedInput.value);
  const rotation = t * rotationSpeed * 0.25;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#020207";
  ctx.fillRect(0, 0, w, h);

  drawRadialTriangleCells(w, h, t, rotation);
  drawCenterPrism(w, h, t, rotation * 1.15);
  drawGlowLayer(w, h, BEAUTY_GLOW * 0.18);
  drawCellLines(w, h, rotation);
  drawEyepiece(w, h);

  requestAnimationFrame(draw);
}
</script>
</body>
</html>
